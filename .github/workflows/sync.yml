name: Sync configs
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub minimum)
  workflow_dispatch:
  push:
    paths: ["sync_configs.py"]
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python sync_configs.py
      - name: Commit changes
        run: |
          git config user.name "pax-mods-bot"
          git config user.email "bot@users.noreply.github.com"
          git add configs
          git diff --cached --quiet || (git commit -m "sync configs" && git push)
